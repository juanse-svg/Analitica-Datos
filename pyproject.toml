[project]
name = "analytics"
version = "0.1.0"
description = "Proyecto del semestre - Analitica de Datos"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "pandas>=2.2",
    "pandera>=0.20",
    "scikit-learn>=1.9.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Los tests de los labs se copian tal cual del enunciado (no se modifican).
# Comparan explícitamente contra True/False por claridad pedagógica del lab.
"tests/*" = ["E712"]
